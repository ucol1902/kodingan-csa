  function maskNama(name) {
    if (!name) return "";
    const trimmed = name.trim();
    if (trimmed.length === 0) return "";
    const words = trimmed.split(/\s+/);
    const processedWords = words.map(word => {
      if (word.length <= 3) return word;
      return word.slice(0, 3) + '*'.repeat(word.length - 3);
    });
    return processedWords.join(' ');
  }

  function maskNIP(nip) {
    if (!nip) return "";
    const nipStr = String(nip).trim();
    return nipStr.replace(/\d/g, '*');
  }

  function cleanEmailAddress(email) {
    if (!email) return "";
    let clean = String(email).toLowerCase().trim();
    
    // Strip "pusat\" or "pusat/" or other domain login prefixes
    if (clean.includes('\\')) {
      const parts = clean.split('\\');
      clean = parts[parts.length - 1];
    }
    if (clean.includes('/')) {
      const parts = clean.split('/');
      clean = parts[parts.length - 1];
    }
    if (clean.startsWith('pusat')) {
      clean = clean.replace(/^pusat[\\\/]?/, '');
    }
    
    return clean;
  }

  }

  function verifySecurePassword() {
    const input = document.getElementById('secure-password-input');

    if (!input) return;
    
    const val = input.value;

    const onSuccess = () => {
      const callback = pendingSecureCallback;
      closePasswordModal();
      if (callback) {

          callback();
        }, 150);
      }
    };

    const onFailure = () => {
      if (errMsg) {
        errMsg.style.display = 'block';
      }
      if (card) {
        card.classList.remove('animate-shake');
        card.offsetHeight; // force reflow

      }

      input.focus();
      input.select();
    };

        .withSuccessHandler((isValid) => {
          if (isValid) {
            onSuccess();
          } else {
            onFailure();
          }
        })

          } else {

          }
        })
        .verifyPasswordOnServer(val);
    } else {

      } else {

      }
    }

  // Deduplicates an array of unit target objects keeping only the first one found for each name + month combination
  function deduplicateTargets(list) {

    const seen = new Set();
    return list.filter(u => {
      if (!u || !u.name) return false;
      const key = `${String(u.name).toUpperCase().trim()}_${String(u.bulan || '').toUpperCase().trim()}`;
      if (seen.has(key)) {

      }
      seen.add(key);

    });

  // Helper to uniquely identify and map employee NIP or Name to merge duplicates

    const nip = String(emp.nip || '').trim().toUpperCase();
    const isNipValid = nip && nip !== '-' && nip !== 'TIDAK ADA' && nip !== 'BELUM ADA' && nip !== '0' && nip !== '';
    
    if (isNipValid) {
      return `NIP_${nip}`;

      const nameClean = String(emp.nama || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

      if (!nameClean) {
        return `RANDOM_${index || Math.random()}`;
      }
      return `NAME_${nameClean}_UNIT_${unitClean}`;
    }
  }

  // Helper to find an employee in referenceEmployees database (STRICTLY BY UNIQUE NIP)

    if (!referenceEmployees || referenceEmployees.length === 0) {
      return null;
    }

    // Preserve alphanumeric NIPs (e.g. 9618004BE, NIPG, or numeric NIPs)
    const cleanNip = (v) => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    const nipToSearch = cleanNip(nipVal);

    const isNipSearchValid = nipToSearch && nipToSearch !== '0' && nipToSearch !== '-' && nipToSearch !== 'TIDAKADA' && nipToSearch !== 'BELUMADA' && nipToSearch.length >= 3;

    if (isNipSearchValid) {
      for (const ref of referenceEmployees) {
        const refNip = cleanNip(ref.nip);
        if (refNip && refNip === nipToSearch) {
          return ref;
        }
      }
    }

    // STRICT REQUIREMENT: NIP is unique. If NIP does not match any record in Referensi_Pegawai, return null to skip saving it.
    return null;
  }

    const keyMap = {};
    empList.forEach((emp, index) => {
      if (!emp) return;
      const key = getEmployeeUniqueKey(emp, index);
      
      if (!keyMap[key]) {
        keyMap[key] = { ...emp };
      } else {
        const existing = keyMap[key];
        
        // Merge mengikutiAwareness and jawabanBenar (prefer affirmative/completed values over default/negative ones)
        const getBestValue = (val1, val2, defaultVals) => {
          const str1 = String(val1 || '').trim();
          const str2 = String(val2 || '').trim();
          if (!str1 && str2) return str2;
          if (str1 && !str2) return str1;
          
          const isDefault1 = defaultVals.some(v => str1.toLowerCase() === v.toLowerCase());
          const isDefault2 = defaultVals.some(v => str2.toLowerCase() === v.toLowerCase());
          
          if (isDefault1 && !isDefault2) return str2;
          if (!isDefault1 && isDefault2) return str1;
          
          return str1; 
        };
        
        // Prefer the fields associated with the higher score if both have scores
        const p1 = parseFloat(existing.persentase) || 0;
        const p2 = parseFloat(emp.persentase) || 0;
        if (p2 > p1) {
          existing.persentase = p2;
          existing.jawabanBenar = emp.jawabanBenar;
          existing.mengikutiAwareness = emp.mengikutiAwareness;
        } else {
          existing.persentase = p1;
          existing.mengikutiAwareness = getBestValue(existing.mengikutiAwareness, emp.mengikutiAwareness, ['', 'tidak', 'belum', 'tidak ada']);
          existing.jawabanBenar = getBestValue(existing.jawabanBenar, emp.jawabanBenar, ['', 'tidak quiz', 'tidak', 'belum']);
        }
        
        // Merge NIP if one has '-' but another has a real NIP
        const existingNip = String(existing.nip || '').trim().toUpperCase();
        const empNip = String(emp.nip || '').trim().toUpperCase();
        const isExistingNipValid = existingNip && existingNip !== '-' && existingNip !== 'TIDAK ADA' && existingNip !== 'BELUM ADA' && existingNip !== '0';
        const isEmpNipValid = empNip && empNip !== '-' && empNip !== 'TIDAK ADA' && empNip !== 'BELUM ADA' && empNip !== '0';
        
        if (!isExistingNipValid && isEmpNipValid) {
          existing.nip = emp.nip;
        }
      }
    });
    
    const results = Object.values(keyMap);
    results.forEach((e, idx) => {
      e.no = idx + 1;
    });
    return results;
  }

  // Sorts arrays containing unit objects (having a name or nameProp) according to the index of INITIAL_MASTER_UNITS
  function sortUnitsByDatabaseOrder(list, nameProp = 'name') {
    if (!list || !Array.isArray(list)) return [];
    
    const orderMap = {};
    INITIAL_MASTER_UNITS.forEach((u, index) => {
      orderMap[String(u.name || '').toUpperCase().trim()] = index;
    });

    return [...list].sort((a, b) => {
      const nameA = String(a[nameProp] || '').toUpperCase().trim();
      const nameB = String(b[nameProp] || '').toUpperCase().trim();
      
      const indexA = orderMap[nameA] !== undefined ? orderMap[nameA] : 999;
      const indexB = orderMap[nameB] !== undefined ? orderMap[nameB] : 999;
      
      return indexA - indexB;
    });
  }

    const histMap = {};

      if (!histMap[b]) histMap[b] = { bulan: b, totalTarget: 0, totalSisa: 0, snapshotData: '' };
      
      const realisasiSudah = Number(u.realisasi) || 0; 
      histMap[b].totalTarget += (Number(u.target) || 0);
      
      // if we have historic data on sisa (Target - Realisasi), we compute it or just use Realisasi
      const unitSisa = Math.max(0, (Number(u.target) || 0) - realisasiSudah);
      histMap[b].totalSisa += unitSisa;
    });

    history = Object.values(histMap).map(h => {
      let percent = h.totalTarget > 0 ? parseFloat((( (h.totalTarget - h.totalSisa) / h.totalTarget ) * 100).toFixed(1)) : 100;
      return {
        bulan: h.bulan,
        pencapaian: percent,
        totalPegawai: h.totalTarget,
        snapshotData: h.snapshotData
      }
    });

  }

  function normalizeUnitText(rawText) {
    if (!rawText) return '';
    let t = String(rawText).toUpperCase().trim().replace(/\s+/g, ' ').replace(/[-_]/g, ' ');

    // Normalize commonly trimmed words inside names
    // 1. Sungai Penuh
    if (t.includes('SUNGAI PENUH') || t.includes('SUNGAI_PENUH') || t.includes('SUNGAIPENUH') || t.includes('SNGAI PNUH') || t.includes('SNGAI_PNUH') || t.includes('SNGAIPNUH')) {
      return 'ULP SNGAI PNUH';
    }
    // 2. Rimbo Bujang
    if (t.includes('RIMBO BUJANG') || t.includes('RIMBOBUJANG') || t.includes('RMB BUJANG') || t.includes('RMBBUJANG')) {
      return 'ULP RMB BUJANG';
    }
    // 3. Kuala Tungkal
    if (t.includes('KUALA TUNGKAL') || t.includes('KUALATUNGKAL') || t.includes('KUALA TNGKL') || t.includes('KUALATNGKL')) {
      return 'ULP KUALA TNGKL';
    }
    // 4. Muara Bulian
    if (t.includes('MUARA BULIAN') || t.includes('MUARABULIAN') || t.includes('MRA BULIAN') || t.includes('MRABULIAN') || t.includes('MRA. BULIAN')) {
      return 'ULP MRA BULIAN';
    }
    // 5. Seberang Kota
    if (t.includes('SEBERANG KOTA') || t.includes('SEBERANGKOTA') || t.includes('SBRNG KOTA') || t.includes('SBRNGKOTA') || t.includes('SBRG KOTA')) {
      return 'ULP SBRNG KOTA';
    }
    // 6. Telanai Pura
    if (t.includes('TELANAI PURA') || t.includes('TELANAIPURA') || t.includes('TLANAI PURA') || t.includes('TLANAIPURA') || t.includes('TLN PURA')) {
      return 'ULP TLANAI PURA';
    }
    // 7. ULTG Muara Bungo
    if (t.includes('ULTG MUARA BUNGO') || t.includes('ULTG MUARABUNGO') || (t.includes('ULTG') && t.includes('BUNGO'))) {
      return 'ULTG MUARABUNGO';
    }
    // 8. UPP Sumbagteng 1, 2, 3 / UIP Sumbagteng (Pembangunan)
    if ((t.includes('UPP') || t.includes('PEMBANGUNAN') || t.includes('SUMBAGTENG3') || t.includes('SUMBAGTENG 3') || (t.includes('UIP') && !t.includes('UIP3B') && !t.includes('UIP3BS'))) && !t.includes('UP2B')) {
      return 'UPP SUMBAGTENG3';
    }
    // 9. UP3 Muara Bungo
    if (t.includes('UP3 MUARA BUNGO') || t.includes('UP3 MUARABUNGO') || (t.includes('UP3') && t.includes('BUNGO'))) {
      return 'UP3 MUARA BUNGO';
    }

    // Direct match cleanup for other units just in case there are minor whitespace/abbreviation issues
    if (t === 'ULP SAROLANGUN') return 'ULP SAROLANGUN';
    if (t === 'ULP MUARA TEBO' || t.includes('MUARA TEBO')) return 'ULP MUARA TEBO';
    if (t === 'ULP KERSIK TUO' || t.includes('KERSIK TUO')) return 'ULP KERSIK TUO';
    if (t === 'ULP BANGKO' || t.includes('BANGKO')) return 'ULP BANGKO';
    if (t === 'ULP KOTA BUNGO' || t.includes('KOTA BUNGO')) return 'ULP KOTA BUNGO';
    if (t === 'UP3 JAMBI' || t.includes('UP3 JAMBI')) return 'UP3 JAMBI';
    if (t === 'ULP KOTA BARU' || t.includes('KOTA BARU')) return 'ULP KOTA BARU';
    if (t === 'ULP MUARA SABAK' || t.includes('MUARA SABAK')) return 'ULP MUARA SABAK';
    if (t === 'UPT JAMBI' || t.includes('UPT JAMBI')) return 'UPT JAMBI';
    if (t === 'ULTG AUR DURI' || t.includes('AUR DURI') || t.includes('AURDURI')) return 'ULTG AUR DURI';
    if (t === 'UP2K JAMBI' || (t.includes('UP2K') && t.includes('JAMBI'))) return 'UP2K JAMBI';

    return t;
  }

  function resolveStandardUnitForEmployee(refMatch, unitRaw) {
    if (!refMatch) return normalizeUnitText(unitRaw);

    const allMasterNames = INITIAL_MASTER_UNITS.map(u => String(u.name).toUpperCase().trim());

    const subUnitNorm = refMatch.subUnit ? normalizeUnitText(refMatch.subUnit) : '';
    const unitNorm = refMatch.unit ? normalizeUnitText(refMatch.unit) : '';
    const rawUnitNorm = normalizeUnitText(unitRaw);

    if (subUnitNorm && allMasterNames.includes(subUnitNorm)) {
      return subUnitNorm;
    }
    if (unitNorm && allMasterNames.includes(unitNorm)) {
      return unitNorm;
    }
    if (rawUnitNorm && allMasterNames.includes(rawUnitNorm)) {
      return rawUnitNorm;
    }

    return subUnitNorm || unitNorm || rawUnitNorm || 'UP3 MUARA BUNGO';
  }

  // Normalizes any date string or Date object into Indonesian formatted Month Year string like "Juni 2026"
  function getNormalizedBulanLabel(val) {
    if (!val) return "Mei 2026";
    
    const indonesianMonths = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    
    // 1. If it's a native Date, format it safely with a 12-hour buffer to avoid midnight timezone shift!
    if (val instanceof Date || Object.prototype.toString.call(val) === '[object Date]') {
      const adjustedDate = new Date(val.getTime() + 12 * 60 * 60 * 1000);
      return indonesianMonths[adjustedDate.getMonth()] + " " + adjustedDate.getFullYear();
    }
    
    const valStr = String(val).trim();
    if (!valStr) return "Mei 2026";
    
    const lower = valStr.toLowerCase();
    
    // 2. Year Extraction (default to 2026 if not found)
    const yearMatch = valStr.match(/\b(20\d{2})\b/);
    const year = yearMatch ? parseInt(yearMatch[1]) : 2026;
    
    // 3. Month string keyword matcher (performs text-based mapping to bypass timezone-unsafe new Date() parsing)
    const monthMap = {
      'januari': 'Januari', 'februari': 'Februari', 'maret': 'Maret', 'april': 'April', 'mei': 'Mei', 'juni': 'Juni',
      'juli': 'Juli', 'agustus': 'Agustus', 'september': 'September', 'oktober': 'Oktober', 'november': 'November', 'desember': 'Desember',
      'january': 'Januari', 'february': 'Februari', 'march': 'Maret', 'june': 'Juni',
      'july': 'Juli', 'august': 'Agustus', 'october': 'Oktober', 'december': 'Desember',
      'jan': 'Januari', 'feb': 'Februari', 'mar': 'Maret', 'apr': 'April', 'may': 'Mei', 'jun': 'Juni',
      'jul': 'Juli', 'aug': 'Agustus', 'sep': 'September', 'oct': 'Oktober', 'nov': 'November', 'dec': 'Desember'
    };
    
    for (const [key, indMonth] of Object.entries(monthMap)) {
      if (lower.indexOf(key) !== -1) {
        return indMonth + " " + year;
      }
    }
    
    // 4. Numerical date parsing fallback (e.g., 2026-05-01, 05/2026)
    if (valStr.includes('/') || valStr.includes('-')) {
      const numbers = valStr.match(/\b\d+\b/g);
      if (numbers && numbers.length >= 2) {
        let monthIndex = -1;
        if (numbers[0].length === 4) {
          // Format: YYYY-MM-DD
          monthIndex = parseInt(numbers[1]) - 1;
        } else if (numbers[1].length === 4) {
          // Format: MM/YYYY or DD/MM/YYYY
          monthIndex = parseInt(numbers[0]) - 1;
        } else {
          // Format: DD-MM-YYYY
          monthIndex = parseInt(numbers[1]) - 1;
        }
        if (monthIndex >= 0 && monthIndex < 12) {
          return indonesianMonths[monthIndex] + " " + year;
        }
      }
    }
    
    return valStr;
  }

  // Get current system month label
  function getCurrentMonthLabel() {
    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const now = new Date();
    return `${months[now.getMonth()]} ${now.getFullYear()}`;
  }

  function parseMonthLabel(label) {
    if (!label) return null;
    const parts = label.trim().split(/\s+/);
    if (parts.length < 2) return null;
    const indonesianMonths = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const mIndex = indonesianMonths.findIndex(m => m.toLowerCase() === parts[0].toLowerCase());
    const year = parseInt(parts[1]);
    if (mIndex === -1 || isNaN(year)) return null;
    return { month: mIndex, year: year };
  }

  function isPastMonth(label) {
    const currentLabel = getCurrentMonthLabel();
    const current = parseMonthLabel(currentLabel);
    const target = parseMonthLabel(label);
    if (!current || !target) return false;
    if (target.year < current.year) return true;
    if (target.year === current.year && target.month < current.month) return true;
    return false;
  }

  // Fetch targets for a month with a smart clone behavior if targets are missing
  function getTargetsForMonth(monthLabel) {
    masterUnits = deduplicateTargets(masterUnits);
    let list = masterUnits.filter(u => String(u.bulan || '').toLowerCase().trim() === monthLabel.toLowerCase().trim());
    if (list.length > 0) {
      return list;
    }
    
    // Fallback: Copy targets from the latest available month in masterUnits
    const allMonths = [...new Set(masterUnits.map(u => u.bulan || ''))].filter(Boolean);
    if (allMonths.length > 0) {
      const fallbackMonth = allMonths[allMonths.length - 1];
      const fallbackList = masterUnits.filter(u => String(u.bulan || '').toLowerCase().trim() === fallbackMonth.toLowerCase().trim());
      
      const newItems = fallbackList.map(u => {
        const baseId = u.id.split('_')[0];
        return {
          id: baseId + '_' + monthLabel,
          name: u.name,
          parent: u.parent,
          target: u.target,
          bulan: monthLabel,
          realisasi: 0,
          tanggalUpdate: ''
        };
      });
      
      masterUnits = masterUnits.concat(newItems);
      masterUnits = deduplicateTargets(masterUnits);
      reconstructHistoryFromMasterUnits();
      return newItems;
    }
    
    // Ultimate fallback: Recreate from INITIAL_MASTER_UNITS
    const defaultItems = INITIAL_MASTER_UNITS.map(u => ({
      id: u.id + '_' + monthLabel,
      name: u.name,
      parent: u.parent,
      target: u.target,
      bulan: monthLabel,
      realisasi: 0,
      tanggalUpdate: ''
    }));
    masterUnits = masterUnits.concat(defaultItems);
    masterUnits = deduplicateTargets(masterUnits);
    reconstructHistoryFromMasterUnits();
    return defaultItems;
  }

  // Helpers to parse and format update timestamp for the stamp board
  function formatUpdateTimestamp(rawStr) {
    if (!rawStr) {
      // Fallback: use current date & time formatted nicely (similar to mock)
      const now = new Date();
      return formatIndonesianDateTime(now);
    }
    
    try {
      let cleanStr = String(rawStr).replace(/\./g, ':').replace(/,/g, '');
      const parts = cleanStr.split(/\s+/);
      if (parts.length >= 2) {
        const dateParts = parts[0].split('/');
        const timeParts = parts[1].split(':');
        if (dateParts.length === 3 && timeParts.length >= 2) {
          const day = parseInt(dateParts[0]);
          const month = parseInt(dateParts[1]) - 1;
          const year = parseInt(dateParts[2]);
          const hour = parseInt(timeParts[0]);
          const min = parseInt(timeParts[1]);
          const d = new Date(year, month, day, hour, min);
          if (!isNaN(d.getTime())) {
            return formatIndonesianDateTime(d);
          }
        }
      }
      
      const parsed = new Date(cleanStr);
      if (!isNaN(parsed.getTime())) {
        return formatIndonesianDateTime(parsed);
      }
    } catch(e) {
      console.warn("Date parsing error: ", e);
    }
    
    return rawStr; // fallback if parsing failed
  }

  function formatIndonesianDateTime(dateObj) {
    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    const day = String(dateObj.getDate()).padStart(2, '0');
    const month = months[dateObj.getMonth()];
    const year = dateObj.getFullYear();
    const hours = String(dateObj.getHours()).padStart(2, '0');
    const minutes = String(dateObj.getMinutes()).padStart(2, '0');
    return `${day}-${month}-${year} ${hours}:${minutes}`;
  }

  function compareDateStrings(str1, str2) {
    const parseToDate = (rawStr) => {
      if (!rawStr) return new Date(0);
      try {
        let cleanStr = String(rawStr).replace(/\./g, ':').replace(/,/g, '');
        const parts = cleanStr.split(/\s+/);
        if (parts.length >= 2) {
          const dateParts = parts[0].split('/');
          const timeParts = parts[1].split(':');
          if (dateParts.length === 3 && timeParts.length >= 2) {
            const day = parseInt(dateParts[0]);
            const month = parseInt(dateParts[1]) - 1;
            const year = parseInt(dateParts[2]);
            const hour = parseInt(timeParts[0]);
            const min = parseInt(timeParts[1]);
            return new Date(year, month, day, hour, min);
          }
        }
        const d = new Date(cleanStr);
        if (!isNaN(d.getTime())) return d;
      } catch (e) {}
      return new Date(0);
    };

    return parseToDate(str1).getTime() - parseToDate(str2).getTime();
  }

  // Handle Excel Upload
  function handleExcelUpload(event) {
    const file = event.target.files[0];
    
    // Clear input so same file can be selected again
    event.target.value = '';

    if (!file) return;

    if (typeof XLSX === 'undefined') {
      triggerToast('Library Excel belum dimuat. Periksa koneksi internet.', true);
      return;
    }

    withPasswordProtection(() => {
      showLoader(true, 'Sedang membaca file Excel...');

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          
          // Grab the first sheet
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          // Convert to JSON
          const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
          
          // Normalize Unit naming and process data
          processUploadedData(rawJson, file.name);

        } catch (err) {
          console.error(err);
          showLoader(false);
          triggerToast('Gagal memproses file Excel: Format tidak valid.', true);
        }
      };
      reader.onerror = function(err) {
          showLoader(false);
          triggerToast('Gagal membaca file dari penyimpanan Anda.', true);
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function processUploadedData(rawJson, fileName) {
    // 1. Definition of group's target units in OUR system
    const groupUnitsMapping = {
      'UID S2JB': [
        'UP3 MUARA BUNGO', 'ULP SAROLANGUN', 'ULP SNGAI PNUH', 'ULP MUARA TEBO', 'ULP KERSIK TUO', 'ULP BANGKO', 'ULP RMB BUJANG', 'ULP KOTA BUNGO',
        'UP3 JAMBI', 'ULP KOTA BARU', 'ULP KUALA TNGKL', 'ULP MRA BULIAN', 'ULP MUARA SABAK', 'ULP SBRNG KOTA', 'ULP TLANAI PURA',
        'UP2K JAMBI'
      ],
      'P3BS': [
        'UPT JAMBI', 'ULTG AUR DURI', 'ULTG MUARABUNGO'
      ],
      'UIP': [
        'UPP SUMBAGTENG3'
      ]
    };

    // Helper to extract clean cell value from any row object
    const getValFromRow = (rowObj, possibleKeys) => {
      if (!rowObj || typeof rowObj !== 'object') return '';
      const keys = Object.keys(rowObj);
      for (const k of possibleKeys) {
        const cleanK = k.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!cleanK) continue;
        const foundKey = keys.find(x => {
          const cleanX = x.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
          return cleanX === cleanK || cleanX.includes(cleanK);
        });
        if (foundKey && rowObj[foundKey] !== undefined && rowObj[foundKey] !== null) {
          return String(rowObj[foundKey]).trim();
        }
      }
      return '';
    };

    // Helper to detect group from filename or unit text string
    const detectGroupFromText = (str) => {
      if (!str) return null;
      const s = String(str).toUpperCase().trim();
      
      // 1. P3BS / Transmisi check (MUST be evaluated before UIP to correctly catch UIP3B and UIP3BS)
      if (s.includes('UIP3B') || s.includes('UIP3BS') || s.includes('P3BS') || s.includes('P3B') || s.includes('UPT') || s.includes('ULTG') || s.includes('UP2B') || s.includes('TRAG') || s.includes('TRANSMISI') || s.includes('PENYALURAN') || s.includes('PENGATUR BEBAN')) {
        return 'P3BS';
      }
      
      // 2. UIP / UPP (Pembangunan)
      if (s.includes('UPP') || s.includes('PEMBANGUNAN') || s.includes('SUMBAGTENG3') || s.includes('SUMBAGTENG 3') || (s.includes('UIP') && !s.includes('UIP3B') && !s.includes('UIP3BS')) || (s.includes('SUMBAGTENG') && !s.includes('UP2B'))) {
        return 'UIP';
      }
      
      // 3. UID S2JB (Distribusi)
      if (s.includes('S2JB') || s.includes('UID') || s.includes('UP3') || s.includes('ULP') || s.includes('UP2K') || s.includes('DISTRIBUSI') || s.includes('MUARA BUNGO')) {
        return 'UID S2JB';
      }

      return null;
    };

    // Smart detector for file source Group based on filename or row keywords (even ignored ones from outer regions)
    let detectedGroup = detectGroupFromText(fileName);

    if (!detectedGroup) {
      // Analyze actual row unit contents to detect Group
      let uipWeight = 0;
      let p3bsWeight = 0;
      let s2jbWeight = 0;

      rawJson.forEach(row => {
        const unitRaw = String(getValFromRow(row, ['unit', 'unit kerja', 'penempatan', 'unitkerja', 'organisasi', 'unit_kerja']) || '').toUpperCase().trim();
        if (!unitRaw) return;

        const rowGroup = detectGroupFromText(unitRaw);
        if (rowGroup === 'P3BS') {
          p3bsWeight++;
        } else if (rowGroup === 'UIP') {
          uipWeight++;
        } else if (rowGroup === 'UID S2JB') {
          s2jbWeight++;
        }
      });

      if (p3bsWeight >= uipWeight && p3bsWeight >= s2jbWeight && p3bsWeight > 0) {
        detectedGroup = 'P3BS';
      } else if (uipWeight > p3bsWeight && uipWeight >= s2jbWeight) {
        detectedGroup = 'UIP';
      } else if (s2jbWeight > p3bsWeight && s2jbWeight > uipWeight) {
        detectedGroup = 'UID S2JB';
      }
    }

    // 2. Parse and filter the Excel rows matching OUR system
    const importedEmployees = [];
    let skippedNotInReference = 0;

    rawJson.forEach(row => {
      const nama = getValFromRow(row, ['nama', 'name', 'nama lengkap', 'namakaryawan', 'pegawai', 'nama_lengkap', 'nama pegawai']);
      const nip = getValFromRow(row, ['nip', 'nomor induk', 'nipg', 'no induk', 'no. induk', 'nip/nipg', 'nip / nipg', 'nip pegawai', 'nip_pegawai', 'no.induk', 'no_induk', 'noinduk', 'nipg/nip', 'nip/no.induk', 'nip/no induk', 'id pegawai', 'id_pegawai', 'nik']);
      const email = getValFromRow(row, ['email korporat', 'email', 'mail', 'corporate email', 'email_korporat', 'email_pegawai', 'alamat email']);
      const unitRaw = getValFromRow(row, ['unit', 'unit kerja', 'penempatan', 'unitkerja', 'unit_kerja', 'unit pelayanan', 'unit_pelayanan']);
      const ikut = getValFromRow(row, ['mengikuti awareness', 'mengikuti awarnes', 'awareness', 'ikut', 'mengikutikuis']);
      const benar = getValFromRow(row, ['jawaban benar', 'benar', 'score', 'jawaban benar / status kuis', 'skorkuis', 'jawabanbenar']);
      const persen = getValFromRow(row, ['persentase', 'presentase', 'percentage', 'persen', 'nilai']);

      if (!nama) return; // Skip invalid empty rows

      // Compare with the employee reference database
      const refMatch = findInReference(nama, nip, email);
      if (!refMatch) {
        skippedNotInReference++;
        return; // Skip/ignore employees not in our reference list because they are outside STI Jambi unit
      }

      // Use matched employee's unit to normalize placement
      const standardUnit = resolveStandardUnitForEmployee(refMatch, unitRaw);

      // Determine which group this unit belongs to, to decide if we keep it
      let foundGroup = null;
      for (const [grpName, grpUnits] of Object.entries(groupUnitsMapping)) {
        if (grpUnits.includes(standardUnit)) {
          foundGroup = grpName;
          break;
        }
      }

      // ONLY include rows that belong to known system units
      if (foundGroup) {
        importedEmployees.push({
          no: importedEmployees.length + 1,
          nama: String(refMatch.nama || nama).trim(),
          nip: String(refMatch.nip || nip).trim(),
          unit: standardUnit,
          _group: foundGroup,
          mengikutiAwareness: String(ikut).trim() || 'Tidak',
          jawabanBenar: String(benar).trim() || 'Tidak Quiz',
          persentase: parseFloat(persen) || 0
        });
      } else {
        skippedNotInReference++;
      }
    });

    if (referenceEmployees.length === 0) {
      triggerToast('Peringatan: Referensi Pegawai kosong! Silakan isi/unggah data referensi terlebih dahulu.', true);
    }

    // If we have imported rows that successfully matched reference employees, let the matched reference employees group take precedence!
    if (importedEmployees.length > 0) {
      const groupCounts = {};
      importedEmployees.forEach(emp => {
        groupCounts[emp._group] = (groupCounts[emp._group] || 0) + 1;
      });
      const topMatchedGroup = Object.keys(groupCounts).reduce((a, b) => groupCounts[a] > groupCounts[b] ? a : b, null);
      if (topMatchedGroup) {
        detectedGroup = topMatchedGroup;
      }
    }

    if (!detectedGroup) {
      showLoader(false);
      triggerToast('Gagal memproses: File ini tidak terdeteksi milik UID S2JB, P3BS, atau UIP/UPP.', true);
      return;
    }

    // Filter parsed records to ONLY include records belonging to the detected group
    const finalImportedEmployees = importedEmployees.filter(emp => emp._group === detectedGroup).map(emp => {
      delete emp._group; // remove temp property
      return emp;
    });

    // 3. Keep employees that belong to OTHER groups, REMOVE ALL OLD employees from THIS group, and ADD the newly imported ones.
    const newGlobalEmployees = employees.filter(emp => {
      // Find what group this old employee belongs to
      let oldEmpGroup = null;
      for (const [grpName, grpUnits] of Object.entries(groupUnitsMapping)) {
        if (grpUnits.includes(String(emp.unit).toUpperCase().trim())) {
          oldEmpGroup = grpName;
          break;
        }
      }
      return oldEmpGroup !== detectedGroup;
    });

    // Safety fallback: recalculate the "no" later
    const combinedEmployees = [...newGlobalEmployees, ...finalImportedEmployees];
    
    // Re-assign "no" field purely for visual indexing
    combinedEmployees.forEach((e, idx) => e.no = idx + 1);

    // 4. Set global state with inline deduplication
    employees = deduplicateEmployees(combinedEmployees);

    // 5. Calculate realisasi (Always target the CURRENT running month for Excel uploads to avoid historical collision)
    const nowStr = new Date().toLocaleString('id-ID');
    const targetMonth = getCurrentMonthLabel();
    
    // Ensure targets for targetMonth exist
    getTargetsForMonth(targetMonth);
    
    masterUnits.forEach(u => {
      if (u.bulan === targetMonth) {
        // Only update units belonging to this uploaded detected group
        const groupUnits = groupUnitsMapping[detectedGroup] || [];
        if (groupUnits.includes(String(u.name).toUpperCase().trim())) {
          const sisaCount = employees.filter(emp => emp && String(emp.unit).toUpperCase().trim() === String(u.name).toUpperCase().trim()).length;
          if (sisaCount > (u.target || 0)) {
            u.target = sisaCount;
          }
          u.realisasi = Math.max(0, (u.target || 0) - sisaCount);
          u.tanggalUpdate = nowStr;
        }
      }
    });
    
    reconstructHistoryFromMasterUnits();

    // 6. Sync up both employees and targets
    syncToSpreadsheet(() => {
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.updateUnitTargets === 'function') {
        google.script.run.withSuccessHandler(() => {
          let suffixMsg = skippedNotInReference > 0 ? ` [Mengabaikan ${skippedNotInReference} data di luar Referensi Pegawai STI Jambi]` : '';
          if (finalImportedEmployees.length === 0) {
            triggerToast(`Autodeteksi File ${detectedGroup}: Berhasil sinkronisasi. Seluruh sub-unit di kelompok ini 100% Tuntas (0 sisa)!${suffixMsg}`);
          } else {
            triggerToast(`Autodeteksi File ${detectedGroup}: Berhasil sinkronisasi ${finalImportedEmployees.length} pegawai belum survei.${suffixMsg}`);
          }
          renderAll();
        }).updateUnitTargets(masterUnits);
      } else {
        let suffixMsg = skippedNotInReference > 0 ? ` [Mengabaikan ${skippedNotInReference} data di luar Referensi Pegawai STI Jambi]` : '';
        if (finalImportedEmployees.length === 0) {
          triggerToast(`Autodeteksi File ${detectedGroup}: Berhasil sinkronisasi. Seluruh sub-unit di kelompok ini 100% Tuntas (0 sisa)!${suffixMsg}`);
        } else {
          triggerToast(`Autodeteksi File ${detectedGroup}: Berhasil sinkronisasi ${finalImportedEmployees.length} pegawai belum survei.${suffixMsg}`);
        }
        renderAll();
      }
    });
  }

  // Sync current layout modification back to Spreadsheet database
  function syncToSpreadsheet(onComplete) {
    showLoader(true, 'Sedang menyimpan data ke Google Sheets...');
    
    if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.updateAllEmployeesOnSheet === 'function') {

        triggerToast('Offline/Sandbox Mode: Simulasi berhasil disimpan ke memori!');

        renderAll();
      }, 600);

  // Renders / updates the interactive Leaflet map of Jambi Units with a premium, locked overlay card system
  function drawOverlayLeaderLines() {
    const svg = document.getElementById('map-svg-overlay');
    if (!svg) return;
    svg.innerHTML = ''; // clear previous lines

    const canvas = document.getElementById('jambi-map-canvas');
    if (!canvas || !jambiMap) return;
    const canvasRect = canvas.getBoundingClientRect();

    activeMapUnits.forEach((item, index) => {
      const cardEl = document.getElementById(`map-card-unit-${index}`);
      if (!cardEl) return;

      const cardRect = cardEl.getBoundingClientRect();
      // Calculate center horizontal of the card relative to the canvas
      const cardX = (cardRect.left - canvasRect.left) + cardRect.width / 2;
      // Point from the bottom of the card
      const cardY = (cardRect.top - canvasRect.top) + cardRect.height;

      const pinLatLng = L.latLng(item.origLat, item.origLng);
      const pinPoint = jambiMap.latLngToContainerPoint(pinLatLng);

      const u = item.summary;
      const markerColor = getUnitStatusColor(u.target, u.sisa).hex;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', String(cardX));
      line.setAttribute('y1', String(cardY));
      line.setAttribute('x2', String(pinPoint.x));
      line.setAttribute('y2', String(pinPoint.y));
      line.setAttribute('stroke', markerColor);
      line.setAttribute('stroke-width', '1.8');
      line.setAttribute('stroke-dasharray', '5, 6');
      line.setAttribute('opacity', '0.85');
      line.setAttribute('stroke-linecap', 'round');

      svg.appendChild(line);
    });
  }

    const canvas = document.getElementById('jambi-map-canvas');

    if (processedUnits.length === 0) {
      activeMapUnits = [];
      return;
    }

    // Sort processedUnits by longitude (origLng ascending) to prevent dashed leader lines from crossing each other
    processedUnits.sort((a, b) => a.origLng - b.origLng);

    activeMapUnits = processedUnits;

      };
      cardNode.onmouseout = () => {
        cardNode.style.transform = 'scale(1)';
        cardNode.style.boxShadow = '0 4px 12px rgba(0,0,0,0.45)';

      const pulseRingHtml = u.sisa > 0 ? `<div class="map-pulse-ring" style="position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px; border-radius: 8px; background: ${markerColor}; z-index: -1;"></div>` : '';

    // Handle container map zooming/fitting based on active parent group filters
    if (jambiMap && shownLatLnds.length > 0) {
      try {
        const bounds = L.latLngBounds(shownLatLnds);
        jambiMap.fitBounds(bounds, {
          paddingTopLeft: [45, 125], // Large top padding to make sure Kuala Tungkal is never covered by the top header deck
          paddingBottomRight: [45, 30]
        });

        console.error("Bounds fitting error:", e);
      }

    // Trigger initial calculation of overlay leader lines after layout completes
    setTimeout(drawOverlayLeaderLines, 100);

    // Handle container resizing on first draw
    if (isFirstInit) {
      setTimeout(() => {
        jambiMap.invalidateSize();

  // Helper to extract parent org unit
  function getUnitParent(unitName) {
    if (!unitName || String(unitName).toLowerCase().trim() === 'all') return 'all';
    const cleanName = normalizeUnitText(unitName);
    // Look in current masterUnits first
    const found = masterUnits.find(u => String(u.name).toUpperCase().trim() === cleanName);
    if (found) return found.parent;
    // Fallback to INITIAL_MASTER_UNITS
    const foundInit = INITIAL_MASTER_UNITS.find(u => String(u.name).toUpperCase().trim() === cleanName);
    if (foundInit) return foundInit.parent;
    return cleanName; // fallback to itself
  }

  // Captures the entire high-fidelity executive dashboard for instant sharing, optimizing for mobile screens
  function captureDashboardScreenshot() {
    const area = document.getElementById('screenshot-capture-area');
    if (!area) return;

    // Show visual loading
    showLoader(true, 'Menyiapkan berkas gambar beresolusi tinggi...');

    // Guarantee html2canvas is present
    if (typeof html2canvas === 'undefined') {
      showLoader(false);
      alert('Modul html2canvas gagal dimuat. Sila pastikan sambungan internet aktif.');
      return;
    }

    // Temporarily force desktop standard layouts (1080px table, grid, etc) on mobile for stunning share output ratios!
    const originalStyle = area.getAttribute('style') || '';
    
    // Apply temporary layout expansion styles
    area.setAttribute('style', originalStyle + '; width: 1080px !important; min-width: 1080px !important; max-width: 1080px !important; background: #0f172a !important; padding: 24px !important; border-radius: 0px !important;');
    
    // Disable pfade fading inside during output capture
    const animatedElements = area.querySelectorAll('.animate-fade-in');
    animatedElements.forEach(el => {
      el.style.animation = 'none';
      el.style.opacity = '1';
    });

    // Invalidate map layout sizing so Leaflet matches 1080px width immediately
    if (jambiMap) {
      jambiMap.invalidateSize();
    }

    // Short timeout for browser to complete DOM reflow before snapping
    setTimeout(() => {
      // Capture using html2canvas with optimum options for pristine high-dpi mobile display
      html2canvas(area, {
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#0f172a',
        scale: 2, // Double resolution scale for premium text crispness
        logging: false,
        width: 1080,
        windowWidth: 1080
      }).then(canvas => {
        // Restore layout style immediately
        area.setAttribute('style', originalStyle);
        animatedElements.forEach(el => {
          el.style.animation = '';
          el.style.opacity = '';
        });
        if (jambiMap) {
          jambiMap.invalidateSize();
        }

        showLoader(false);
        
        const cleanMonthLabel = String(selectedDashboardMonth || getCurrentMonthLabel()).trim().replace(/\s+/g, '-');
        const cleanParentLabel = String(selectedDashboardParentGroup || 'Semua-Unit').trim().replace(/\s+/g, '-');
        const filename = `SelesaiSurvei-Laporan-${cleanParentLabel}-${cleanMonthLabel}.png`;
        
        try {
          const link = document.createElement('a');
          link.download = filename;
          link.href = canvas.toDataURL('image/png', 0.95);
          link.click();
          triggerToast('Screenshot laporan berhasil diunduh!');
        } catch (err) {
          console.error("Link capture downloads error, attempting popup window", err);
          try {
            const dataUrl = canvas.toDataURL('image/png');
            const win = window.open();
            win.document.write('<html><head><title>Executive Dashboard SelesaiSurvei</title></head><body style="margin:0; background:#f8fafc; display:flex; align-items:center; justify-content:center;"><img src="' + dataUrl + '" style="max-width:100%; max-height:100vh; box-shadow:0 10px 40px rgba(15,23,42,0.1); border-radius:8px;" /></body></html>');
            triggerToast('Mengalihkan screenshot ke tab baru...');
          } catch (popupErr) {
            triggerToast('Popup diblokir browser, tidak dapat menyelesaikan unduhan', true);
          }
        }
      }).catch(err => {
        // Reset styles even if error occurs
        area.setAttribute('style', originalStyle);
        animatedElements.forEach(el => {
          el.style.animation = '';
          el.style.opacity = '';
        });
        if (jambiMap) {
          jambiMap.invalidateSize();
        }
        showLoader(false);
        console.error(err);
        triggerToast('Gagal merender tangkapan layar: ' + err.message, true);
      });
    }, 450);
  }

  // Calculate stats based on dynamic masterUnits benchmark targeting for a specific month
  function calculateStatsForMonth(monthLabel) {
    let currentTargets = getTargetsForMonth(monthLabel);
    const isCurrentRunningMonth = String(monthLabel).toLowerCase().trim() === getCurrentMonthLabel().toLowerCase().trim();
    
    if (isCurrentRunningMonth) {
      // Auto adjust target of each unit if sisa count > target
      currentTargets.forEach(master => {
        const sisaCount = employees.filter(emp => emp && String(emp.unit).toUpperCase().trim() === String(master.name).toUpperCase().trim()).length;
        if (sisaCount > (master.target || 0)) {
          master.target = sisaCount;
          
          // Ensure it is updated in masterUnits array as well
          const found = masterUnits.find(u => u.id === master.id);
          if (found) {
            found.target = sisaCount;
            found.realisasi = 0;
          }
        }
      });
    }
    
    // Filter targets by selected parent group if selected
    let filteredTargets = currentTargets;
    if (selectedDashboardParentGroup !== 'all') {
      filteredTargets = currentTargets.filter(u => u.parent === selectedDashboardParentGroup);
    }

    const totalBenchmark = filteredTargets.reduce((sum, u) => sum + (Number(u.target) || 0), 0);
    
    let totalSudah = 0;
    let totalSisa = 0;

    if (isCurrentRunningMonth) {
      // Filter uncompleted staff based on selected parent group
      const filteredEmployeesForStats = selectedDashboardParentGroup !== 'all'
        ? employees.filter(emp => emp && getUnitParent(emp.unit) === selectedDashboardParentGroup)
        : employees;

      totalSisa = filteredEmployeesForStats.length;
      totalSudah = Math.max(0, totalBenchmark - totalSisa);
    } else {
      // For historical/past or non-running months, take directly from database columns
      totalSudah = filteredTargets.reduce((sum, u) => sum + (Number(u.realisasi) || 0), 0);
      totalSisa = Math.max(0, totalBenchmark - totalSudah);
    }

    const completionPercent = totalBenchmark > 0 ? parseFloat(((totalSudah / totalBenchmark) * 100).toFixed(1)) : 100;

    // Calculate details per unit
    const unitSummaries = filteredTargets.map(master => {
      let sisaCount = 0;
      let sudahCount = 0;
      
      if (isCurrentRunningMonth) {
        sisaCount = employees.filter(emp => emp && String(emp.unit).toUpperCase().trim() === String(master.name).toUpperCase().trim()).length;
        sudahCount = Math.max(0, master.target - sisaCount);
        
        // Let's also sync the local unit's realisasi dynamically
        master.realisasi = sudahCount;
      } else {
        sudahCount = Number(master.realisasi) || 0;
        sisaCount = Math.max(0, master.target - sudahCount);
      }

      const percent = master.target > 0 ? parseFloat(((sudahCount / master.target) * 100).toFixed(1)) : 100;
      return {
        ...master,
        totalPegawai: master.target,
        sudahSurvei: sudahCount,
        belumSurvei: sisaCount,
        completionRate: percent,
        sisa: sisaCount,
        sudah: sudahCount,
        percentage: percent
      };
    });

    // Calculate details per parent org
    const groups = selectedDashboardParentGroup !== 'all' ? [selectedDashboardParentGroup] : ['UP3 MUARA BUNGO', 'UP3 JAMBI', 'UPT JAMBI', 'UP2K JAMBI', 'UPP SUMBAGTENG3'];
    const groupSummaries = groups.map(gName => {
      const allTargetsForGroup = getTargetsForMonth(monthLabel).filter(u => u.parent === gName);
      const groupTarget = allTargetsForGroup.reduce((sum, u) => sum + (Number(u.target) || 0), 0);
      
      let groupSisa = 0;
      let groupSudah = 0;
      
      if (isCurrentRunningMonth) {
        groupSisa = employees.filter(emp => emp && getUnitParent(emp.unit) === gName).length;
        groupSudah = Math.max(0, groupTarget - groupSisa);
      } else {
        groupSudah = allTargetsForGroup.reduce((sum, u) => sum + (Number(u.realisasi) || 0), 0);
        groupSisa = Math.max(0, groupTarget - groupSudah);
      }
      
      const percent = groupTarget > 0 ? parseFloat(((groupSudah / groupTarget) * 100).toFixed(1)) : 100;
      
      return {
        name: gName,
        target: groupTarget,
        sisa: groupSisa,
        sudah: groupSudah,
        percentage: percent
      };
    });

    return {
      totalPegawai: totalBenchmark,
      belumSurvei: totalSisa,
      sudahSurvei: totalSudah,
      completionRate: completionPercent,
      unitSummaries: sortUnitsByDatabaseOrder(unitSummaries, 'name'),
      groupSummaries: groupSummaries
    };
  }

  // Calculate stats based on current running month
  function calculateStats() {
    if (!selectedDashboardMonth) {
      selectedDashboardMonth = getCurrentMonthLabel();
    }
    return calculateStatsForMonth(selectedDashboardMonth);
  }

      groupData.units = sortUnitsByDatabaseOrder(groupData.units, 'name');

      // Always render parent total row to provide a clear distinction between parent totals and sub-units
      allBoxesHtml += renderBox(pStats, true); // true for group parent

      if (selectedDashboardParentGroup !== 'all' || groupData.units.length > 1) {
        groupData.units.forEach((u, uIdx) => {

    }

    let html = `

  // Helper to extract or generate fallback snapshot per unit for a historical month
  function getHistorySnapshot(hist) {
    if (hist.snapshotData && hist.snapshotData.trim() !== '') {
      try {
        return JSON.parse(hist.snapshotData);
      } catch(e) {
        console.warn("Failed parsing snapshotData", e);
      }
    }
    
    // Fallback: Reconstruct from INITIAL_MASTER_UNITS
    const baseUnits = JSON.parse(JSON.stringify(INITIAL_MASTER_UNITS));
    
    // Adjust known historical deviations
    // April / early months has target 327, where ULTG MUARABUNGO's target was 23 instead of 28.
    return baseUnits.map(u => {
      let targetVal = Number(u.target) || 0;
      if (u.name === 'ULTG MUARABUNGO') {
        if (hist.totalPegawai === 327 || hist.totalPegawai === 321) {
          targetVal = 23;
        } else if (hist.totalPegawai === 332) {
          targetVal = 28;
        }
      }
      return {
        id: u.id,
        name: u.name,
        parent: u.parent,
        target: targetVal,
        sisa: 0,
        sudah: targetVal,
        percentage: 100
      };
    });
  }

  // Get items corresponding to filters
  function getFilteredEmployees() {
    return employees.filter(emp => {
      if (!emp) return false;

      const empNama = String(emp.nama).toLowerCase();
      const empNip = String(emp.nip).toLowerCase();
      const q = searchEmployeeQuery.toLowerCase();
      
      const matchSearch = empNama.includes(q) || empNip.includes(q);

      let matchParent = true;
      if (selectedParentGroup !== 'all') {
        const parentUnits = masterUnits
          .filter(u => u.parent === selectedParentGroup)
          .map(u => String(u.name).toUpperCase());
        matchParent = parentUnits.includes(String(emp.unit).toUpperCase());
      }

      let matchUnit = true;
      if (selectedUnit !== 'all') {
        matchUnit = String(emp.unit).toUpperCase() === selectedUnit.toUpperCase();
      }

      let matchStatus = true;
      if (selectedAwarenessStatus !== 'all') {
        const awStr = String(emp.mengikutiAwareness).toUpperCase().trim();
        if (selectedAwarenessStatus === 'Ya') {
          matchStatus = awStr === 'YA';
        } else if (selectedAwarenessStatus === 'Tidak') {
          matchStatus = awStr === 'TIDAK';
        } else {
          matchStatus = !awStr || awStr === '';
        }
      }

      return matchSearch && matchParent && matchUnit && matchStatus;
    });
  }

  function copyFilteredEmployeesList() {
    withPasswordProtection(() => {
      const filtered = getFilteredEmployees();
      if (filtered.length === 0) {
        triggerToast('Daftar pegawai kosong, tidak ada yang disalin.', true);
        return;
      }
      
      // Extracted raw list of names separated by newline (REAL NAMES, uncensored!)
      const listNames = filtered.map(emp => emp.nama).join('\n');
      
      // Copy using modern clipboard API, and fallback to textarea
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(listNames)
          .then(() => {
            triggerToast(`Berhasil menyalin ${filtered.length} nama pegawai (unmasked) ke clipboard!`);
          })
          .catch(err => {
            fallbackCopyToClipboard(listNames, filtered.length);
          });
      } else {
        fallbackCopyToClipboard(listNames, filtered.length);
      }
    });
  }

  function fallbackCopyToClipboard(text, count) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";  // Avoid scrolling to bottom
    textArea.style.left = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      triggerToast(`Berhasil menyalin ${count} nama pegawai ke clipboard!`);
    } catch (err) {
      console.error('Fallback copy failed', err);
      triggerToast('Gagal menyalin ke clipboard.', true);
    }
    document.body.removeChild(textArea);
  }

  // Individual save submission manual
  function saveIndividualEmployee() {
    const valName = document.getElementById('form-name').value.trim();

  // Clean data-paste from excel workbook imports
  function processExcelBulkPaste() {
    const rawVal = document.getElementById('paste-input').value.trim();
    if (!rawVal) {
      triggerToast('Kliping kosong! Harap tempel data salinan Excel di textarea dulu.', true);
      return;
    }

    withPasswordProtection(() => {
      try {
        showLoader(true, 'Mem-parsing pindaian baris spreadsheet...');
        
        const lines = rawVal.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const parsedItems = [];
        let skippedHeaders = 0;
        let skippedNotInReference = 0;

        for (let i = 0; i < lines.length; i++) {
          // Evaluate separator splits (Tabs primarily)
          let parts = lines[i].split('\t');
          if (parts.length < 2) parts = lines[i].split(';');
          if (parts.length < 2) parts = lines[i].split(',');

          // Trim values
          parts = parts.map(cell => cell.trim().replace(/^['"]|['"]$/g, ''));

          // Smart column index detection: check if first column is numeric row number "No" (e.g. 1, 2, 3)
          const firstPart = parts[0] || '';
          const secondPart = parts[1] || '';
          const isFirstColNumber = /^[0-9]{1,4}$/.test(firstPart) && parts.length >= 3 && secondPart.length > 0;

          let offset = 0;
          let rowNo = employees.length + parsedItems.length + 1;
          if (isFirstColNumber) {
            rowNo = parseInt(firstPart) || rowNo;
            offset = 1;
          }

          const namaVal = parts[offset] || '';
          const nipVal = parts[offset + 1] || '';
          const unitRawPasted = parts[offset + 2] || '';
          const cleanAware = parts[offset + 3] || 'Ya';
          const cleanQuiz = parts[offset + 4] || 'Tidak Quiz';
          let rawPct = String(parts[offset + 5] || '0').replace('%', '').trim();
          const cleanPct = parseInt(rawPct) || 0;
          const emailVal = parts.find(cell => cell.includes('@') && cell.includes('.')) || '';

          // Safely ignore column name headers
          const lowerNama = namaVal.toLowerCase();
          const lowerNip = nipVal.toLowerCase();
          if (lowerNama === 'nama' || lowerNama === 'nama lengkap' || lowerNama === 'no' || lowerNip === 'nip' || lowerNip === 'nomor induk') {
            skippedHeaders++;
            continue;
          }

          if (!namaVal) continue; // skip orphan rows

          // Compare with the employee reference database
          const refMatch = findInReference(namaVal, nipVal, emailVal);
          if (!refMatch) {
            skippedNotInReference++;
            continue; // Skip/ignore employees not in our reference list because they are outside STI Jambi unit
          }

          // Auto clean sub-unit targets matchers
          let cleanUnit = resolveStandardUnitForEmployee(refMatch, unitRawPasted || 'UP3 MUARA BUNGO');

          parsedItems.push({
            no: rowNo,
            nama: String(refMatch.nama || namaVal).trim(),
            nip: String(refMatch.nip || nipVal).trim(),
            unit: cleanUnit,
            mengikutiAwareness: cleanAware,
            jawabanBenar: cleanQuiz,
            persentase: cleanPct
          });
        }

        if (parsedItems.length === 0) {
          showLoader(false);
          let errMsg = 'Gagal memproses baris! Mohon pastikan minimal terdapat kolom Nama & NIP.';
          if (skippedNotInReference > 0) {
            errMsg += ` (${skippedNotInReference} data dilewati karena tidak cocok dengan Referensi Pegawai)`;
          }
          triggerToast(errMsg, true);
          return;
        }

        // Merge, append & deduplicate items
        employees = deduplicateEmployees([...employees, ...parsedItems]);

        document.getElementById('paste-input').value = '';

        syncToSpreadsheet(() => {
          showLoader(false);
          let extraMsg = '';
          if (skippedHeaders > 0) extraMsg += ` (Melewati ${skippedHeaders} baris header)`;
          if (skippedNotInReference > 0) extraMsg += ` [Mengabaikan ${skippedNotInReference} data di luar Referensi Pegawai STI Jambi]`;
          triggerToast(`Sukses mendaftarkan ${parsedItems.length} sisa pegawai baru!${extraMsg}`);
          setTab('employees');
        });

      } catch (err) {
        showLoader(false);
        triggerToast('Gagal mengurai teks salinan excel: ' + err.message, true);
      }
    });
  }

  // Trigger monthly reset action
  function handleResetBulan() {
    withPasswordProtection(() => {
      showLoader(true, 'Mengarsipkan pencapaian dan mengosongkan sirkulasi...');

      const stats = calculateStats();
      const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const now = new Date();
      const stampLabel = `${months[now.getMonth()]} ${now.getFullYear()}`;

      // Upsert target month entry record
      let revisedHistory = [...history];
      const matchHistoryIdx = revisedHistory.findIndex(h => h.bulan.toLowerCase() === stampLabel.toLowerCase());
      const payload = {
        bulan: stampLabel,
        pencapaian: stats.completionRate,
        totalPegawai: stats.totalPegawai,
        snapshotData: JSON.stringify(stats.unitSummaries)
      };

      if (matchHistoryIdx > -1) {
        revisedHistory[matchHistoryIdx] = payload;
      } else {
        revisedHistory.push(payload);
      }

      history = revisedHistory;
      employees = []; // clean active array lists

      const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
      const hasHistorySync = isGAS && typeof google.script.run.updateMonthlyHistory === 'function';
      const hasEmployeeSync = isGAS && typeof google.script.run.updateAllEmployeesOnSheet === 'function';

      const onResetSuccess = () => {
        showLoader(false);
        triggerToast(`Bulan baru dimulai! Pencapaian historis ${stampLabel} (${stats.completionRate}%) sukses diarsipkan.`);
        setTab('overview');
        renderAll();
      };

      if (hasHistorySync) {
        google.script.run
          .withSuccessHandler(() => {
            if (hasEmployeeSync) {
              google.script.run
                .withSuccessHandler(() => {
                  onResetSuccess();
                })
                .withFailureHandler((err) => {
                  showLoader(false);
                  triggerToast('Gagal mengosongkan daftar pegawai sisa: ' + err.message, true);
                  renderAll();
                })
                .updateAllEmployeesOnSheet([]);
            } else {
              onResetSuccess();
              triggerToast('Info: Arsip bulanan disimpan di Sheets, sisa daftar pegawai di-reset lokal saja (Harap perbarui Code.gs Anda).', true);
            }
          })
          .withFailureHandler((err) => {
            showLoader(false);
            triggerToast('Gagal menyimpan riwayat masa lalu ke Sheets: ' + err.message, true);
          })
          .updateMonthlyHistory(history);
      } else {
        setTimeout(() => {
          if (hasEmployeeSync) {
            google.script.run
              .withSuccessHandler(() => {
                onResetSuccess();
                triggerToast('Sukses di-reset lokal! Catatan: Riwayat gagal disimpan di sheet (Harap perbarui Code.gs Anda).', true);
              })
              .withFailureHandler(() => {
                onResetSuccess();
              })
              .updateAllEmployeesOnSheet([]);
          } else {
            onResetSuccess();
            if (isGAS) {
              triggerToast('Bulan baru dimulai lokal! Silakan perbarui Code.gs Anda untuk sinkronisasi Sheet penuh.', true);
            } else {
              triggerToast(`Buku bulan baru dimulai offline! ${stampLabel} tuntas ${stats.completionRate}%`);
            }
          }
        }, 700);
      }
    });
  }

              u.bulan = getNormalizedBulanLabel(u.bulan);
              if (u.id) {
                const baseId = u.id.includes('_') ? u.id.split('_')[0] : u.id;
                u.id = baseId + '_' + u.bulan;
              }
            });
          }
          showLoader(false);
          renderAll();
        })
        .withFailureHandler((err) => {
          showLoader(false);
          renderAll();
        })
        .getUnitTargets();
    } else {
      masterUnits = INITIAL_MASTER_UNITS.map(u => ({ ...u, id: u.id + '_' + selectedTargetMonth, bulan: selectedTargetMonth }));
      showLoader(false);
      if (isGAS) {
        triggerToast('Database unit dipulihkan ke target awal default (Offline).');
      }
      renderAll();
    }
  }

  function saveNewTargets() {
    masterUnits = deduplicateTargets(masterUnits);
    const inputs = document.querySelectorAll('.unit-target-input');
    
    // First apply values from form inputs to state
    inputs.forEach(input => {
      const uId = input.getAttribute('data-id');
      const val = parseInt(input.value);
      
      const relatedUnitObj = masterUnits.find(u => u.id === uId);
      if (relatedUnitObj && !isNaN(val)) {
        // Memperbolehkan perubahan target historical
        relatedUnitObj.target = val;
      }
    });

    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
    const hasUpdateTargets = isGAS && typeof google.script.run.updateUnitTargets === 'function';

    withPasswordProtection(() => {
      showLoader(true, isGAS && !hasUpdateTargets ? 'Perhatian: Fungsi backend tidak ditemukan...' : 'Menyimpan konfigurasi database unit baru ke Sheets...');
      
      // Update realisasi since target could have been edited
      const nowStr = new Date().toLocaleString('id-ID');
      const runningMonth = getCurrentMonthLabel();
      masterUnits.forEach(u => {
        // Hanya update realisasi & tanggal update untuk bulan target yang sedang aktif terpilih & HANYA jika itu bulan berjalan!
        if (u.bulan === selectedTargetMonth) {
          const isMonthRunning = String(u.bulan).toLowerCase().trim() === runningMonth.toLowerCase().trim();
          if (isMonthRunning) {
            const sisaCount = employees.filter(emp => emp && String(emp.unit).toUpperCase().trim() === String(u.name).toUpperCase().trim()).length;
            if (sisaCount > (u.target || 0)) {
              u.target = sisaCount;
            }
            u.realisasi = Math.max(0, (u.target || 0) - sisaCount);
          } else {
            // Untuk bulan historical, pastikan realisasi tetap sesuai database, maksimal sebesar target barunya
            u.realisasi = Math.min(Number(u.realisasi) || 0, Number(u.target) || 0);
          }
          u.tanggalUpdate = nowStr;
        }
      });
      
      masterUnits = deduplicateTargets(masterUnits);
      reconstructHistoryFromMasterUnits();

      const onSaveComplete = () => {
        showLoader(false);
        isEditingTargetsMode = false;
        
        const btn = document.getElementById('btn-toggle-edit-targets');
        if (btn) {
          btn.className = "btn btn-primary btn-sm align-center";
          btn.style.background = "";
          btn.style.borderColor = "";
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            <span>Kelola Database Unit &amp; Target</span>
          `;
        }
        const cancelBtn = document.getElementById('btn-cancel-edit-targets');
        if (cancelBtn) cancelBtn.remove();

        const addPanel = document.getElementById('panel-add-unit');
        if (addPanel) addPanel.style.display = 'none';
        
        renderAll();
      };

      if (hasUpdateTargets) {
        google.script.run
          .withSuccessHandler((res) => {
            onSaveComplete();
            triggerToast('Database unit dan target berhasil diperbarui!');
          })
          .withFailureHandler((err) => {
            showLoader(false);
            triggerToast('Gagal mengubah database unit: ' + err.message, true);
          })
          .updateUnitTargets(masterUnits);
      } else {
        setTimeout(() => {
          onSaveComplete();
          if (isGAS) {
            triggerToast('Target di-update lokal! Silakan salin & paste isi Code.gs terbaru ke Google Apps Script Editor Anda (Fungsi updateUnitTargets tidak ditemukan).', true);
          } else {
            triggerToast('Offline Mode: Simulasi unit & target berhasil disimpan!');
          }
        }, 700);
      }
    });
  }

  function syncUnitsToSheets(onSuccessCallback, loadingMessage) {
    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
    const hasUpdateTargets = isGAS && typeof google.script.run.updateUnitTargets === 'function';

    showLoader(true, loadingMessage || 'Menyimpan perubahan database unit ke Google Sheets...');

    masterUnits = deduplicateTargets(masterUnits);
    reconstructHistoryFromMasterUnits();

    if (hasUpdateTargets) {
      google.script.run
        .withSuccessHandler((res) => {
          showLoader(false);
          if (onSuccessCallback) onSuccessCallback();
          renderAll();
        })
        .withFailureHandler((err) => {
          showLoader(false);
          triggerToast('Gagal mengubah database unit di Google Sheets: ' + err.message, true);
          renderAll();
        })
        .updateUnitTargets(masterUnits);
    } else {
      setTimeout(() => {
        showLoader(false);
        if (onSuccessCallback) onSuccessCallback();
        renderAll();
        if (isGAS) {
          triggerToast('Perubahan disimpan lokal! Google Sheets tidak terhubung.', true);
        } else {
          triggerToast('Offline Mode: Perubahan unit & target berhasil disimpan!');
        }
      }, 700);
    }
  }

  // Add direct action to create a new sub-unit in memory & save directly to Sheets
  function addNewUnitToState() {
    const nameNode = document.getElementById('new-unit-name');
    const parentNode = document.getElementById('new-unit-parent');
    const targetNode = document.getElementById('new-unit-target');
    
    if (!nameNode || !parentNode || !targetNode) return;
    
    const name = nameNode.value.trim().toUpperCase();
    const parent = parentNode.value;
    const target = parseInt(targetNode.value) || 0;
    
    if (!name) {
      triggerToast('Nama unit tidak boleh kosong!', true);
      return;
    }
    
    // Check if unit name already exists inside the active monthly target period
    const duplicate = masterUnits.find(u => u.name.toUpperCase().trim() === name && String(u.bulan || '').toLowerCase() === selectedTargetMonth.toLowerCase());
    if (duplicate) {
      triggerToast(`Unit "${name}" sudah terdaftar pada periode target ${selectedTargetMonth}!`, true);
      return;
    }
    
    withPasswordProtection(() => {
      // Create new unit payload
      const maxId = Math.max(...masterUnits.map(u => parseInt(u.id.split('_')[0]) || 0), 20);
      const baseId = maxId + 1;
      const newId = baseId + '_' + selectedTargetMonth;
      
      const newUnit = {
        id: newId,
        name: name,
        parent: parent,
        target: target,
        bulan: selectedTargetMonth,
        realisasi: 0,
        tanggalUpdate: ''
      };
      
      masterUnits.push(newUnit);
      
      // Reset inputs
      nameNode.value = '';
      targetNode.value = '';
      
      syncUnitsToSheets(() => {
        triggerToast(`Unit "${name}" berhasil ditambahkan langsung ke Google Sheets!`);
      }, `Menambahkan unit "${name}" ke Google Sheets...`);
    });
  }

  // Delete action to remove a unit and sync directly with Google Sheets
  function deleteUnitFromState(id) {
    const u = masterUnits.find(item => item.id === id);
    if (!u) return;
    
    // Check if there are employees still assigned to this unit in 'Daftar Belum Survey'
    const sisaCount = employees.filter(emp => emp && String(emp.unit).toUpperCase().trim() === String(u.name).toUpperCase().trim()).length;
    
    let confirmMsg = `Hapus unit "${getDisplayUnitName(u.name)}" dari database?\nUnit ini memiliki sasaran target ${u.target} pegawai.`;
    if (sisaCount > 0) {
      confirmMsg += `\n\nPERINGATAN: Ada ${sisaCount} pegawai yang belum survey terdaftar di unit ini! Mereka akan kehilangan penempatan sub-unit jika unit ini dihapus.`;
    }
    
    if (confirm(confirmMsg)) {
      withPasswordProtection(() => {
        masterUnits = masterUnits.filter(item => item.id !== id);
        syncUnitsToSheets(() => {
          triggerToast(`Unit "${u.name}" berhasil dihapus dari Google Sheets!`);
        }, `Menghapus unit "${u.name}" dari Google Sheets...`);
      });
    }
  }

  function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      triggerToast('Teks Broadcast disalin!');
    } catch (err) {
      console.error('Fallback copy failed', err);
      triggerToast('Gagal menyalin teks otomatis. Harap salin teks secara manual.', true);
    }
    document.body.removeChild(textArea);
  }

  function saveHistoryRecord() {
    const bulanNode = document.getElementById('history-bulan');
    const pNode = document.getElementById('history-pencapaian');
    const totalNode = document.getElementById('history-total');
    const indexNode = document.getElementById('edit-history-index');

    if (!bulanNode || !pNode || !totalNode) return;

    const bulan = bulanNode.value.trim();
    const pencapaian = parseFloat(pNode.value);
    const total = parseInt(totalNode.value);

    if (!bulan) {
      triggerToast('Nama bulan tidak boleh kosong!', true);
      return;
    }
    if (isNaN(pencapaian) || pencapaian < 0 || pencapaian > 100) {
      triggerToast('Pencapaian harus berupa angka antara 0 - 100!', true);
      return;
    }
    if (isNaN(total) || total < 0) {
      triggerToast('Total pegawai sasaran tidak valid!', true);
      return;
    }

    withPasswordProtection(() => {
      const editIndexRaw = indexNode.value;
      let existingSnapshot = '';
      
      if (editIndexRaw !== '') {
        const idx = parseInt(editIndexRaw);
        if (history[idx] && history[idx].snapshotData) {
          existingSnapshot = history[idx].snapshotData;
        }
      }

      const payload = {
        bulan: bulan,
        pencapaian: pencapaian,
        totalPegawai: total,
        snapshotData: existingSnapshot
      };

      if (editIndexRaw !== '') {
        // Edit existing
        const idx = parseInt(editIndexRaw);
        history[idx] = payload;
        triggerToast(`Arsip "${bulan}" berhasil diperbarui.`);
      } else {
        // Create new
        history.push(payload);
        triggerToast(`Arsip baru "${bulan}" berhasil ditambahkan.`);
      }

      cancelHistoryEdit();
      syncHistoryToSpreadsheet();
    });
  }

  function deleteHistoryRecord(index) {
    const record = history[index];
    if (!record) return;

    withPasswordProtection(() => {
      if (confirm(`Hapus arsip historis untuk periode "${record.bulan}"?`)) {
        history.splice(index, 1);
        triggerToast(`Arsip "${record.bulan}" berhasil dihapus.`);
        
        // If editing index is matching, cancel edit
        const indexNode = document.getElementById('edit-history-index');
        if (indexNode && parseInt(indexNode.value) === index) {
          cancelHistoryEdit();
        }
        
        syncHistoryToSpreadsheet();
      }
    });
  }

  function handleRefExcelUpload(event) {
    const file = event.target.files[0];
    event.target.value = '';

    if (!file) return;

    if (typeof XLSX === 'undefined') {
      triggerToast('Library Excel belum dimuat. Periksa koneksi internet.', true);
      return;
    }

    withPasswordProtection(() => {
      showLoader(true, 'Sedang membaca file Excel Referensi Pegawai...');

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          processUploadedReferenceData(rawJson);

        } catch (err) {
          console.error(err);
          showLoader(false);
          triggerToast('Gagal memproses file Excel: Format tidak valid.', true);
        }
      };
      reader.onerror = function() {
          showLoader(false);
          triggerToast('Gagal membaca file dari penyimpanan Anda.', true);
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function processUploadedReferenceData(rawJson) {
    const getValFromRow = (rowObj, possibleKeys) => {
      for (const k of possibleKeys) {
        const foundKey = Object.keys(rowObj).find(x => {
          const cleanX = x.trim().toLowerCase().replace(/[-_\\s]+/g, '');
          const cleanK = k.trim().toLowerCase().replace(/[-_\\s]+/g, '');
          return cleanX === cleanK;
        });
        if (foundKey) return rowObj[foundKey];
      }
      return '';
    };

    const parsedList = [];
    rawJson.forEach(row => {
      const nama = getValFromRow(row, ['nama', 'name', 'nama lengkap', 'namakaryawan', 'pegawai']);
      const nip = getValFromRow(row, ['nip', 'nomor induk', 'nipg', 'no induk']);
      const email = getValFromRow(row, ['email korporat', 'email', 'mail', 'corporate email', 'email_korporat']);
      const unitRaw = getValFromRow(row, ['unit pelayanan', 'unit kerja', 'unit', 'penempatan']);
      const subUnit = getValFromRow(row, ['sub unit pelayanan', 'sub unit', 'subunit', 'bagian']);

      if (!nama) return;

      const standardUnit = normalizeUnitText(unitRaw);

      parsedList.push({
        nama: String(nama).trim(),
        nip: String(nip || '-').trim(),
        email: String(email || '-').trim(),
        unit: standardUnit || 'UP3 JAMBI',
        subUnit: String(subUnit || '-').trim()
      });
    });

    if (parsedList.length === 0) {
      showLoader(false);
      triggerToast('Gagal memproses: File excel tidak berisi nama pegawai atau format kolom tidak sesuai.', true);
      return;
    }

    referenceEmployees = parsedList;

    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
    if (isGAS && typeof google.script.run.saveReferensiPegawai === 'function') {
      google.script.run
        .withSuccessHandler((res) => {
          showLoader(false);
          if (res && res.success) {
            triggerToast(`Sukses mengunggah ${res.count} data pegawai referensi ke Google Sheets!`);
          } else {
            triggerToast('Gagal menyimpan ke Google Sheets: ' + (res.error || 'Unknown error'), true);
          }
          updateReferenceDatabaseUI();
        })
        .withFailureHandler((err) => {
          showLoader(false);
          triggerToast('Gagal menyimpan ke Google Sheets: ' + err.message, true);
          updateReferenceDatabaseUI();
        })
        .saveReferensiPegawai(referenceEmployees);
    } else {
      showLoader(false);
      triggerToast(`Sukses memproses offline ${referenceEmployees.length} pegawai referensi!`);
      updateReferenceDatabaseUI();
    }
  }

  function runUrlParameterCheck() {
    if (urlUserChecked) return;

    if (!referenceEmployees || referenceEmployees.length === 0) return;

    let userEmail = null;
    try {
      const p = new URLSearchParams(window.location.search);
      userEmail = p.get('user') || p.get('email') || p.get('username');
    } catch (err) {
      console.warn('Gagal membaca URLSearchParams:', err);
    }

    if (userEmail) {
      urlUserChecked = true;
      executeCsaVerificationForUser(userEmail);
      return;
    }

    // Google Apps Script environment URL parameter query fallback
    if (typeof google !== 'undefined' && google.script && google.script.url && google.script.url.getLocation) {
      google.script.url.getLocation((loc) => {
        if (loc && loc.parameter) {
          const emailVal = loc.parameter.user || loc.parameter.email || loc.parameter.username;
          if (emailVal && !urlUserChecked) {
            urlUserChecked = true;
            executeCsaVerificationForUser(emailVal);
          }
        }
      });
    }
  }

    const overlay = document.getElementById('csa-param-overlay');
    const card = document.getElementById('csa-param-card');
    const content = document.getElementById('csa-param-content');
    const buttons = document.getElementById('csa-param-buttons');
    if (overlay && card && content) {
      content.innerHTML = htmlContent;
      if (buttons) {
        buttons.innerHTML = buttonsHtml || '';
      }
      overlay.style.display = 'flex';
      overlay.offsetHeight; // force reflow
      overlay.style.opacity = '1';
      card.style.transform = 'scale(1)';
    }
  }

  function closeCsaParamModal() {
    const overlay = document.getElementById('csa-param-overlay');
    const card = document.getElementById('csa-param-card');
    if (overlay && card) {
      overlay.style.opacity = '0';
      card.style.transform = 'scale(0.95)';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 250);
    }
  }
</script>
